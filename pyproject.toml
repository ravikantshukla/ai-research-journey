[project]
name = "ml-journey"
version = "0.1.0"
description = "156-week, 23-phase roadmap from the math behind neural networks to AI/ML and AI safety research."
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "matplotlib",
  "pandas",
  "jupyter",
]

[project.optional-dependencies]
dev = [
  "ruff",
  "pytest",
  "nbstripout",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
